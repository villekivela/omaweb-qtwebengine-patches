name: Series applies

# Answer one question daily: does the series still apply to the newest QtWebEngine?
# It needs no Qt, no toolchain and no hours, so it can run every day and say
# what a release will cost before anyone spends a night on a build.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "QtWebEngine version to try, instead of the newest"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest QtWebEngine release
        id: qt
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="$(scripts/newest-engine.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Trying $version"

      - name: Apply the series
        id: apply
        run: |
          git config --global user.email "builder@example.invalid"
          git config --global user.name "Series check"
          # Exit 2 is a conflict, which needs a person. Anything else is this check failing, such as
          # a tarball that is not where it was looked for, and is not reported as a conflict.
          status=0
          scripts/refresh.sh --apply-only "${{ steps.qt.outputs.version }}" "$RUNNER_TEMP/qt" \
            || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report a conflict
        if: failure() && steps.apply.outputs.status == '2'
        env:
          # The tracker is Omaweb's. One place holds everything that needs a
          # person, and this repository keeps no issues of its own.
          GH_TOKEN: ${{ secrets.OMAWEB_ISSUES_TOKEN }}
          GH_REPO: villekivela/omaweb
          VERSION: ${{ steps.qt.outputs.version }}
        run: |
          title="The series does not apply to QtWebEngine $VERSION"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "\`scripts/refresh.sh --apply-only $VERSION\` failed, so the series needs a person before any build is worth starting." \
            "" \
            "Resolve it in a local tree, then export the series back:" \
            "" \
            '```sh' \
            "scripts/refresh.sh $VERSION" \
            "# fix, then: git am --continue" \
            "git format-patch -o /path/to/patches v$VERSION-tarball..HEAD" \
            '```' \
            "" \
            "PROCESS.md says what a Chromium bump costs and which files go stale." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" \
              --label ready-for-human --assignee villekivela
          fi
