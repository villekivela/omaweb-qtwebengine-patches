name: Scripts

# The collector deletes rented machines, and the ways it can go wrong take a
# real build hours to reach. Its test rehearses them against stand-ins in
# seconds, so it runs on every change that could break it.
#
# Shellcheck covers the files this test belongs to. The other scripts predate
# it and have findings of their own.
#
# The PKGBUILD's checksums are checked here too: makepkg checks them only when
# an engine is packaged, and a notice edited without its checksum stopped the
# package there.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

jobs:
  collect-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/collect-builds.sh scripts/test-collect-builds.sh

      - name: Test the collector
        run: scripts/test-collect-builds.sh

  pkgbuild-sums:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/check-pkgbuild-sums.sh

      - name: Check the PKGBUILD's checksums
        run: scripts/check-pkgbuild-sums.sh
